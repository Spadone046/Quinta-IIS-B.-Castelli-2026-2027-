<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Registra Evento</title>
</head>
<body>
<h1>Registrazione evento manuale</h1>
<label for="eventi">Eventi</label><br>
<select id="eventi" name="eventi">
    <option value="concerto">Concerto</option>
    <option value="fiera">Fiera</option>
    <option value="sagra">Sagra</option>
    <option value="festa">Festa</option>
    <option value="raduno">Raduno</option>
</select><br><br>
<label for="luogo">Luogo:</label><br>
<input type="text" id="luogo" name="luogo"><br><br>
<label for="data">Data:</label><br>
<input type="date" id="data" name="data"><br><br>
<label for="titolo">Titolo:</label><br>
<input type="text" id="titolo" name="titolo"><br><br>
<label for="artisti">Artisti:</label><br>
<input type="text" id="artisti" name="artisti"><br><br>
<input type="submit" value="Registra evento"><br><br>
<input type="reset" value="Reset"><br><br>
<label>REGISTRAZIONE DI TUTTI GLI EVENTI DELLA NEWSLETTER</label><br><br>
<input type="submit" value="Registra tutti">
</body>
</html>
